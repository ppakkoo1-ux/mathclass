<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PDF 판서 · 지오지브라</title>
<style>
:root{
  --paper:#ffffff;
  --bg:#e6eaf1; --bar:#ffffff; --bar-border:#d3d9e3; --text:#1d2b4f; --muted:#667089;
  --btn:#f1f4f9; --btn-hover:#e3e8f1; --active:#2b59c3; --active-text:#ffffff; --sep:#dde2ea;
  --page-edge:#c8cfdb; --msg-bg:rgba(29,43,79,.88); --msg-text:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12151c; --bar:#1b1f29; --bar-border:#2a303d; --text:#e4e8f0; --muted:#98a1b3;
    --btn:#252a36; --btn-hover:#2f3544; --active:#5b86e5; --active-text:#ffffff; --sep:#2f3544;
    --page-edge:#2a303d; --msg-bg:rgba(228,232,240,.92); --msg-text:#12151c;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  position:fixed;inset:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-touch-callout:none;
}
#app{display:flex;flex-direction:column;height:100%}
#toolbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:4px;row-gap:4px;flex:0 0 auto;
  padding:4px 8px;padding-top:max(4px, env(safe-area-inset-top));
  background:var(--bar);border-bottom:1px solid var(--bar-border);
  -webkit-user-select:none;user-select:none;
}
#toolbar::-webkit-scrollbar{display:none}
.group{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.sep{width:1px;height:28px;background:var(--sep);flex:0 0 auto;margin:0 2px}
.spacer{flex:1 1 auto;min-width:0}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--active);outline-offset:2px}
.tool{
  min-width:44px;height:44px;padding:3px 5px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;border:0;border-radius:8px;
  background:var(--btn);cursor:pointer;
}
.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool span{font-size:10px;line-height:1;white-space:nowrap}
.tool:hover{background:var(--btn-hover)}
.tool.active{background:var(--active);color:var(--active-text)}
.tool:disabled{opacity:.35;cursor:default;background:var(--btn)}
.seg-ctl{display:flex;background:var(--btn);border-radius:8px;padding:2px;gap:2px}
.seg-ctl button{
  border:0;background:transparent;border-radius:6px;cursor:pointer;min-width:44px;height:40px;
  padding:0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.seg-ctl button b{font-size:13px;font-weight:600}
.seg-ctl button small{font-size:9px;color:var(--muted);white-space:nowrap}
.seg-ctl button.active{background:var(--active);color:var(--active-text)}
.seg-ctl button.active small{color:inherit;opacity:.85}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;background:var(--c);
  border:2px solid var(--bar);box-shadow:0 0 0 1px var(--bar-border)}
.swatch.active{box-shadow:0 0 0 2.5px var(--active)}
.wbtn{width:32px;height:32px;border-radius:8px;border:0;background:var(--btn);cursor:pointer;display:grid;place-items:center}
.wbtn i{display:block;border-radius:50%;background:currentColor}
.wbtn.active{background:var(--active);color:var(--active-text)}
#zoomPct{min-width:40px;text-align:center;font-size:12px;color:var(--muted)}
/* 창이 좁으면 글자를 숨겨 한 줄에 최대한 담고, 그래도 넘치면 두 줄로 */
@media (max-width: 1150px){
  .tool{min-width:36px;height:36px;padding:3px}
  .tool span{display:none}
  .seg-ctl button{height:34px;min-width:40px}
  .seg-ctl button small{display:none}
}
#ver{font-size:12px;opacity:.7}

#viewer{flex:1 1 auto;min-height:0;overflow:hidden;position:relative;touch-action:none;background:var(--paper,#ffffff)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.page{position:absolute;background:#fff}
body.pageborder .page{outline:1px solid rgba(0,0,0,.12);outline-offset:0}
.page canvas{position:absolute;left:0;top:0;display:block}
.page .pdfc{z-index:1}
.page .boxes{position:absolute;inset:0;z-index:2}
.page .inkc{z-index:3;pointer-events:none}
.pageno{position:absolute;right:6px;bottom:4px;z-index:4;font-size:11px;color:#98a1b3;pointer-events:none}

.ggbbox{position:absolute;background:#fff;border:1px solid transparent;border-radius:6px;
  box-shadow:none;overflow:hidden;transition:border-color .15s, box-shadow .15s}
.ggbbox.ui-show,.ggbbox.live.manip,body.mode-ggb .ggbbox{
  border-color:var(--active);box-shadow:0 3px 12px rgba(0,0,0,.14)}
.bxhead,.bxresize{opacity:0;pointer-events:none;transition:opacity .15s}
.ggbbox.ui-show .bxhead,.ggbbox.ui-show .bxresize,
body.mode-ggb .bxhead,body.mode-ggb .bxresize{opacity:1;pointer-events:auto}
.bxhead{position:absolute;left:0;right:0;top:0;height:34px;z-index:2;display:flex;align-items:center;gap:4px;padding:0 4px;
  background:rgba(43,89,195,.92);color:#fff;font-size:12px;touch-action:none;cursor:move;-webkit-user-select:none;user-select:none}
.bxhead .t{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.bxhead button{height:26px;padding:0 8px;border:0;border-radius:6px;background:rgba(255,255,255,.22);color:#fff;font-size:12px;cursor:pointer}
.bxbody{position:absolute;inset:0;background:#fff}
.bxbody img{display:block;object-fit:fill}
.bxbody .host{width:100%;height:100%}
.bxguard{position:absolute;inset:0;z-index:1;pointer-events:none}
.bxtoggle{position:absolute;right:4px;bottom:4px;z-index:4;height:30px;min-width:30px;padding:0 9px;
  display:flex;align-items:center;gap:4px;border-radius:15px;border:1px solid rgba(43,89,195,.45);
  background:rgba(255,255,255,.88);color:#2b59c3;font-size:12px;font-weight:600;cursor:pointer;
  touch-action:manipulation;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.bxtoggle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ggbbox.live.manip .bxtoggle{background:#2b59c3;color:#fff;border-color:#2b59c3}
.ggbbox.live.manip .bxhead{opacity:1;pointer-events:auto}
.ggbbox.live .bxguard{pointer-events:auto}
.ggbbox.live.manip .bxguard,body.mode-ggb .ggbbox.live .bxguard{pointer-events:none}
.ggbbox.live.manip.ui-show{box-shadow:0 0 0 2px var(--active),0 3px 12px rgba(0,0,0,.2)}
.bxresize{position:absolute;right:0;top:34px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg, transparent 50%, var(--active) 50%);border-radius:0 0 0 4px}

#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);
  font-size:15px;line-height:1.7;padding:24px;pointer-events:none}
#quickBtn{
  position:absolute;z-index:60;left:0;top:0;width:58px;height:58px;padding:0;border-radius:50%;
  border:1px solid var(--bar-border);background:var(--bar);color:var(--text);
  box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer;touch-action:none;
}
#quickBtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#quickBtn .q-eraser{display:none}
#quickBtn.eraser{background:var(--active);color:var(--active-text);border-color:transparent}
#quickBtn.eraser .q-pen{display:none}
#quickBtn.eraser .q-eraser{display:block}
#colorRing{position:absolute;z-index:62;display:none;flex-direction:column;gap:5px;padding:6px;
  background:var(--bar);border:1px solid var(--bar-border);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
#colorRing.show{display:flex}
#colorRing .row{display:flex;gap:5px}
#colorRing .c{width:26px;height:26px;border-radius:50%;border:2px solid var(--bar);
  box-shadow:0 0 0 1px var(--bar-border);cursor:pointer;background:var(--c)}
#colorRing .c.active{box-shadow:0 0 0 2px var(--active)}
#colorRing .w{width:26px;height:22px;border:0;border-radius:6px;background:var(--btn);color:var(--text);
  display:grid;place-items:center;cursor:pointer}
#colorRing .w i{display:block;border-radius:50%;background:currentColor}
#colorRing .w.active{background:var(--active);color:var(--active-text)}
#expandBtn{position:absolute;z-index:61;left:8px;top:8px;width:46px;height:46px;border-radius:10px;
  border:1px solid var(--bar-border);background:var(--bar);color:var(--text);display:none;place-items:center;cursor:pointer}
#expandBtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.lean #expandBtn{display:grid}
body.lean #toolbar{display:none}
#autoBar{position:absolute;z-index:75;left:50%;top:70px;transform:translateX(-50%);display:none;align-items:center;gap:8px;
  padding:8px 10px 8px 14px;background:var(--bar);color:var(--text);border:1px solid var(--bar-border);border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px;max-width:calc(100% - 24px)}
#autoBar.show{display:flex}
#autoBar button{height:34px;padding:0 12px;border:0;border-radius:8px;background:var(--btn);color:var(--text);cursor:pointer;font-weight:600}
#autoBar button.ok{background:var(--active);color:var(--active-text)}
#loadMenu{position:absolute;z-index:74;display:none;flex-direction:column;gap:4px;padding:8px;min-width:240px;max-width:calc(100% - 16px);
  background:var(--bar);color:var(--text);border:1px solid var(--bar-border);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#loadMenu.show{display:flex}
#loadMenu .lm-h{font-size:12px;color:var(--muted);padding:4px 6px 2px}
#loadMenu button{text-align:left;height:40px;padding:0 10px;border:0;border-radius:8px;background:var(--btn);color:var(--text);cursor:pointer;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selBar{position:absolute;z-index:58;display:none;gap:4px;padding:4px;background:var(--bar);
  border:1px solid var(--bar-border);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.16)}
#selBar.show{display:flex}
#selBar button{height:40px;padding:0 14px;border:0;border-radius:8px;cursor:pointer;background:var(--btn);color:var(--text);font-size:14px;font-weight:600}
#selBar button.danger{background:#e03131;color:#fff}
#toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-8px);z-index:70;
  background:var(--msg-bg);color:var(--msg-text);font-size:14px;padding:9px 14px;border-radius:8px;
  pointer-events:none;opacity:0;transition:opacity .18s,transform .18s;max-width:calc(100% - 24px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#busy{position:absolute;inset:0;z-index:80;display:none;place-items:center;background:rgba(0,0,0,.35);color:#fff;font-size:15px}
#busy.show{display:grid}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="group">
      <button class="tool" id="openPdfBtn" aria-label="PDF 열기">
        <svg viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 0 1 2-2h6l2 2h4a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 15.5v-6M9.5 12L12 9.5l2.5 2.5"/></svg><span>PDF 열기</span>
      </button>
      <button class="tool" id="saveBtn" aria-label="저장">
        <svg viewBox="0 0 24 24"><path d="M5 4.5h11L19.5 8v11.5h-15z"/><path d="M8.5 4.5v5h7"/><rect x="8" y="13" width="8" height="6.5"/></svg><span>저장</span>
      </button>
      <button class="tool" id="loadBtn" aria-label="불러오기">
        <svg viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v11.5z"/><path d="M12 9.5v6M9.5 13L12 15.5 14.5 13"/></svg><span>불러오기</span>
      </button>
    </div>
    <div class="sep"></div>
    <div class="seg-ctl" role="group" aria-label="입력 모드">
      <button data-mode="auto"><b>자동</b><small>펜 필기·손 조작</small></button>
      <button data-mode="draw"><b>필기</b><small>모든 입력 필기</small></button>
      <button data-mode="ggb"><b>조작</b><small>모든 입력 조작</small></button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="tool" data-tool="pen" aria-label="펜">
        <svg viewBox="0 0 24 24"><path d="M4 20l1-4.2L16.3 4.5a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.2 19z"/><path d="M14.5 6.3l3.2 3.2"/></svg><span>펜</span>
      </button>
      <button class="tool" data-tool="eraser" aria-label="지우개">
        <svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.6 15.6l9.8-9.8a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 18.8H7.8z"/><path d="M9.2 11l4.8 4.8"/></svg><span>지우개</span>
      </button>
      <button class="tool" id="partialBtn" aria-pressed="false" aria-label="부분 지우기">
        <svg viewBox="0 0 24 24"><path d="M3 18c2.5-4 4.5-5.5 6-5"/><path d="M15 11c1.5-2 3.5-4.5 6-6"/><circle cx="12" cy="12" r="3.4" stroke-dasharray="2 2"/></svg><span>부분 지우기</span>
      </button>
      <button class="tool" data-tool="select" aria-label="영역 선택">
        <svg viewBox="0 0 24 24"><path d="M12 4.5c4.4 0 8 2.1 8 4.8s-3.6 4.8-8 4.8-8-2.1-8-4.8 3.6-4.8 8-4.8z" stroke-dasharray="2.6 2.4"/><path d="M7.5 13.3c-1 1.6-.6 3.2 1 3.9 1.3.6 1.4 2 .2 3.3"/></svg><span>영역 선택</span>
      </button>
      <button class="tool" id="shapeBtn" aria-pressed="true" aria-label="도형 보정">
        <svg viewBox="0 0 24 24"><path d="M3 20.5L11.5 12"/><circle cx="16.5" cy="7.5" r="4.5"/></svg><span>도형 보정</span>
      </button>
    </div>
    <div class="sep"></div>
    <div class="group" id="colors"></div>
    <div class="sep"></div>
    <div class="group" id="widths"></div>
    <div class="sep"></div>
    <div class="group">
      <button class="tool" id="addGgbBtn" aria-label="지오지브라 추가">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M12 9v6M9 12h6"/></svg><span>지오지브라 추가</span>
      </button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="tool" id="fitBtn" aria-label="페이지 맞춤">
        <svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><path d="M8 8h8v8H8z"/></svg><span>페이지 맞춤</span>
      </button>
      <button class="tool" id="paperBtn" aria-label="배경색">
        <svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><path d="M4.5 15l4-4 3 3 3-3 5 5"/></svg><span id="paperLabel">배경 흰색</span>
      </button>
      <button class="tool" id="borderBtn" aria-pressed="true" aria-label="페이지 테두리">
        <svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="2" stroke-dasharray="3 2"/></svg><span>테두리</span>
      </button>
      <button class="tool" id="zoomOut" aria-label="축소">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6M20 20l-4.4-4.4"/></svg><span>축소</span>
      </button>
      <div id="zoomPct">100%</div>
      <button class="tool" id="zoomIn" aria-label="확대">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6M11 8v6M20 20l-4.4-4.4"/></svg><span>확대</span>
      </button>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button class="tool" id="leanBtn" aria-label="툴바 접기">
        <svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16"/><path d="M8 20.5l4-3 4 3"/></svg><span>툴바 접기</span>
      </button>
      <button class="tool" id="fsBtn" aria-label="전체화면">
        <svg viewBox="0 0 24 24"><path d="M4 9V4.5h5M20 9V4.5h-5M4 15v4.5h5M20 15v4.5h-5"/></svg><span>전체화면</span>
      </button>
      <button class="tool" id="undoBtn" aria-label="필기 실행 취소">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>필기 취소</span>
      </button>
      <button class="tool" id="redoBtn" aria-label="필기 다시 실행">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>다시 실행</span>
      </button>
    </div>
  </header>

  <main id="viewer">
    <div id="world"></div>
    <div id="empty">PDF를 열어 시작하세요.<br>페이지 밖 여백에도 필기할 수 있습니다.<br>저장하면 필기가 담긴 PDF가 만들어지고, 이 앱으로 다시 열면 이어서 편집할 수 있습니다.<br><span id="ver"></span></div>
  </main>
</div>

<button id="quickBtn" aria-label="펜/지우개 전환">
  <svg class="q-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.2L16.3 4.5a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.2 19z"/><path d="M14.5 6.3l3.2 3.2"/></svg>
  <svg class="q-eraser" viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.6 15.6l9.8-9.8a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 18.8H7.8z"/><path d="M9.2 11l4.8 4.8"/></svg>
</button>
<div id="selBar" role="toolbar" aria-label="선택한 필기">
  <button class="danger" id="selDel">삭제</button>
  <button id="selDone">선택 해제</button>
</div>
<button id="expandBtn" aria-label="툴바 펼치기">
  <svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16"/><path d="M8 3.5l4 3 4-3"/></svg>
</button>
<div id="colorRing" role="dialog" aria-label="색과 굵기"></div>
<div id="toast" role="status"></div>
<div id="busy">처리 중…</div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileInput" hidden>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const viewer = $('viewer'), worldEl = $('world'), emptyEl = $('empty');
const toastEl = $('toast'), busyEl = $('busy'), quickBtn = $('quickBtn'), selBar = $('selBar');
const zoomPct = $('zoomPct'), partialBtn = $('partialBtn'), shapeBtn = $('shapeBtn');
const undoBtn = $('undoBtn'), redoBtn = $('redoBtn');
const pdfInput = $('pdfInput'), fileInput = $('fileInput');

const COLORS = ['#141414', '#e03131', '#1c6fd6', '#2f9e44', '#f08c00'];
const WIDTHS = [2, 3, 5];
const GLOW = 'rgba(43,89,195,0.28)';
const SEL = '#2b59c3';
const BUILD = '무한 캔버스 v17';
const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
const MODE_MSG = {
  auto: '자동: 펜은 필기, 손가락은 스크롤·확대·지오지브라 조작',
  draw: '필기: 모든 입력이 필기가 됩니다 (이 모드에서는 손가락 스크롤이 안 됩니다)',
  ggb: '조작: 필기 없이 스크롤과 지오지브라 조작만 합니다'
};

const S = {

        if (c) { add(c.x - c.r, c.y - c.r); add(c.x + c.r, c.y + c.r); }
      }
      else if (t.indexOf('function') >= 0) funcs.push(nm);
    }
    if (funcs.length) {
      // 그래프가 있으면 원점과 각 함수의 x절편·극값·y절편이 보이도록
      if (typeof api.setErrorDialogsActive === 'function') api.setErrorDialogsActive(false);
      add(0, 0);
      for (const nm of funcs) for (const [x, y] of funcKeyPoints(api, nm)) add(x, y);
      if (typeof api.setErrorDialogsActive === 'function') api.setErrorDialogsActive(true);
    }
    if (!n) return false;
    const q = JSON.parse(api.getViewProperties(1));
    const W = +q.width, H = +q.height;
    if (!(W > 0 && H > 0)) return false;
    let w = x1 - x0, h = y1 - y0;
    if (funcs.length) { w = Math.max(w, 4); h = Math.max(h, 4); }   // 그래프는 최소 4칸
    if (w < 1e-6 && h < 1e-6) { w = 10; h = 10; }
    w = Math.max(w, 1e-6) * 1.3;          // 여백 15%씩
    h = Math.max(h, 1e-6) * 1.3;
    const unit = Math.max(w / W, h / H);   // 가로세로 같은 비율 유지
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;

/* ===================== 저장 · 불러오기 ===================== */
// ===== PDF 안에 필기 저장 / 꺼내기 =====
// 앱과 테스트에서 같은 코드를 쓰기 위해 PDFLib 을 인자로 받는다.
const PB_KEY = 'PBoardData';
const PB_MARK = '% pdf-board ink\n';
const PB_IMG = 'PBImg';

const _enc = s => new TextEncoder().encode(s);
const _dec = u => new TextDecoder().decode(u);
const _num = v => (Math.round(v * 100) / 100).toString();

function _rgb(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
  return _num(r) + ' ' + _num(g) + ' ' + _num(b);
}

// 편집용 정보가 들어 있으면 꺼내고, 찍어 두었던 필기를 걷어낸 원본 PDF를 돌려준다
async function pbStrip(L, bytes) {
  const { PDFDocument, PDFName, PDFRawStream, PDFArray, PDFRef, PDFDict, decodePDFRawStream } = L;
  const doc = await PDFDocument.load(bytes, { updateMetadata: false });
  const ctx = doc.context, cat = doc.catalog;
  const dref = cat.get(PDFName.of(PB_KEY));
  if (!dref) return { clean: bytes, data: null };
  const st = ctx.lookup(dref);
  const data = JSON.parse(_dec(decodePDFRawStream(st).decode()));
  cat.delete(PDFName.of(PB_KEY));
  if (dref instanceof PDFRef) ctx.delete(dref);

  for (const page of doc.getPages()) {
    const node = page.node;
    const cref = node.get(PDFName.of('Contents'));
    const arr = cref ? ctx.lookup(cref) : null;
    if (arr instanceof PDFArray) {
      for (let i = arr.size() - 1; i >= 0; i--) {
        const r = arr.get(i);
        const s = ctx.lookup(r);
        if (s instanceof PDFRawStream && !s.dict.get(PDFName.of('Filter'))) {
          if (_dec(s.contents.slice(0, PB_MARK.length)) === PB_MARK) {
            arr.remove(i);
            if (r instanceof PDFRef) ctx.delete(r);
          }
        }
      }
    }
    const res = node.Resources();
    const xo = res ? res.lookup(PDFName.of('XObject')) : null;
    if (xo instanceof PDFDict) {
      for (const [k, v] of xo.entries()) {
        if (k.asString().startsWith('/' + PB_IMG)) {
          xo.delete(k);
          if (v instanceof PDFRef) {
            const im = ctx.lookup(v);
            const sm = im && im.dict ? im.dict.get(PDFName.of('SMask')) : null;
            if (sm instanceof PDFRef) ctx.delete(sm);
            ctx.delete(v);
          }
        }
      }
    }
  }
  const clean = await doc.save({ useObjectStreams: false });
  return { clean, data };
}

// 원본 PDF에 필기를 찍고 편집용 정보를 숨겨 넣는다
// pages: [{ toPdf:(x,y)=>[X,Y], strokes:[{color,width,pts:[[x,y,p]],clip:{x,y,w,h}|null}], images:[{png:Uint8Array, rect:{x,y,w,h}}] }]
async function pbBuild(L, cleanBytes, pages, data) {
  const { PDFDocument, PDFName, PDFArray } = L;
  const doc = await PDFDocument.load(cleanBytes, { updateMetadata: false });
  const ctx = doc.context;
  const docPages = doc.getPages();
  const pf = pr => 0.4 + 1.2 * pr;
  const rectPdf = (P, r) => {
    const a = P(r.x, r.y), b = P(r.x + r.w, r.y + r.h);
    return { x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(b[0] - a[0]), h: Math.abs(b[1] - a[1]) };
  };

  for (let i = 0; i < docPages.length && i < pages.length; i++) {
    const pg = pages[i];
    if (!pg || (!pg.strokes.length && !pg.images.length)) continue;
    const page = docPages[i], node = page.node, P = pg.toPdf;
    let ops = PB_MARK + 'Q\nq\n1 J 1 j\n';
    let xo = null;
    if (pg.images.length) {
      // 페이지 자체 Resources 확보 (상속받던 것이면 복제) 후 XObject 사전에 직접 등록
      let res = node.get(PDFName.of('Resources'));
      let resDict = res ? ctx.lookup(res) : null;
      if (!(resDict instanceof L.PDFDict)) {
        const eff = node.Resources();
        resDict = eff ? eff.clone(ctx) : ctx.obj({});
        node.set(PDFName.of('Resources'), resDict);
      }
      xo = resDict.lookup(PDFName.of('XObject'));
      if (!(xo instanceof L.PDFDict)) { xo = ctx.obj({}); resDict.set(PDFName.of('XObject'), xo); }
    }
    let imgNo = 0;
    for (const im of pg.images) {
      const img = await doc.embedPng(im.png);
      const key = PDFName.of(PB_IMG + (++imgNo));
      xo.set(key, img.ref);
      const r = rectPdf(P, im.rect);
      ops += 'q ' + _num(r.w) + ' 0 0 ' + _num(r.h) + ' ' + _num(r.x) + ' ' + _num(r.y) + ' cm ' + key.asString() + ' Do Q\n';
    }
    for (const o of pg.strokes) {
      const pts = o.pts;
      if (!pts.length) continue;
      if (o.clip) {
        const r = rectPdf(P, o.clip);
        ops += 'q ' + _num(r.x) + ' ' + _num(r.y) + ' ' + _num(r.w) + ' ' + _num(r.h) + ' re W n\n';
      }
      const c = _rgb(o.color);
      ops += c + ' RG ' + c + ' rg\n';
      if (pts.length === 1) {
        const a = P(pts[0][0], pts[0][1]);
        ops += _num(o.width * pf(pts[0][2])) + ' w ' + _num(a[0]) + ' ' + _num(a[1]) + ' m ' + _num(a[0]) + ' ' + _num(a[1]) + ' l S\n';
      } else {
        for (let k = 1; k < pts.length; k++) {
          const a = P(pts[k - 1][0], pts[k - 1][1]), b = P(pts[k][0], pts[k][1]);
          ops += _num(o.width * pf((pts[k - 1][2] + pts[k][2]) / 2)) + ' w ' +
            _num(a[0]) + ' ' + _num(a[1]) + ' m ' + _num(b[0]) + ' ' + _num(b[1]) + ' l S\n';
        }
      }
      if (o.clip) ops += 'Q\n';
    }
    ops += 'Q\n';
    const pre = ctx.register(ctx.stream(_enc(PB_MARK + 'q\n')));
    const post = ctx.register(ctx.stream(_enc(ops)));
    const cur = node.get(PDFName.of('Contents'));
    const arr = PDFArray.withContext(ctx);
    arr.push(pre);
    if (cur) {
      const c = ctx.lookup(cur);
      if (c instanceof PDFArray) { for (let k = 0; k < c.size(); k++) arr.push(c.get(k)); }
      else arr.push(cur);
    }
    arr.push(post);
    node.set(PDFName.of('Contents'), arr);
  }
  const dstream = ctx.flateStream(_enc(JSON.stringify(data)));
  doc.catalog.set(PDFName.of(PB_KEY), ctx.register(dstream));
  return await doc.save({ useObjectStreams: false });
}


function dataUrlBytes(u) { return b64ToBytes(String(u).split(',')[1] || ''); }

// 편집용 정보 (autosave=true 이면 켜진 창을 굳히지 않고 현재 상태만 읽는다)
function boardData(autosave) {
  if (!autosave) freezeActive();
  else if (activeBox && activeBox.api) {
    const b = activeBox.b;
    try { b.state = activeBox.api.getBase64(); } catch (_) {}
    try { const png = activeBox.api.getPNGBase64(1, false, 72); if (png) b.png = 'data:image/png;base64,' + png; } catch (_) {}
  }
  return {
    v: 2, app: 'pdf-board', pdfName: S.pdfName, zoom: S.zoom, anchor: viewAnchor(),
    strokes: S.strokes.map(o => ({ id: o.id, page: o.page, box: o.box || 0, color: o.color, width: o.width, pts: o.pts })),
    boxes: S.boxes.map(b => ({ id: b.id, page: b.page, x: b.x, y: b.y, w: b.w, h: b.h, state: b.state, png: b.png, view: b.view, viewKey: b.viewKey }))
  };
}
// 페이지별로 PDF에 찍을 필기·그림
function exportPages() {
  return S.pages.map((p, i) => {
    const vp = p.pageObj.getViewport({ scale: 1 });
    const toPdf = (x, y) => vp.convertToPdfPoint(x, y);
    const strokes = [];
    for (const o of S.strokes) {
      if (o.page !== i) continue;
      const pts = pagePts(o);
      if (!pts || !pts.length) continue;
      let clip = null;
      if (o.box) { const b = boxById(o.box); if (b) clip = { x: b.x, y: b.y, w: b.w, h: b.h }; }
      strokes.push({ color: o.color, width: o.width, pts, clip });
    }
    const images = [];
    for (const b of S.boxes) {
      if (b.page !== i || !b.png) continue;
      const v = normView(b);
      const rect = v ? { x: b.x + b.w * v.fx, y: b.y + b.h * v.fy, w: b.w * v.fw, h: b.h * v.fh } : { x: b.x, y: b.y, w: b.w, h: b.h };
      try { images.push({ png: dataUrlBytes(b.png), rect }); } catch (_) {}
    }
    return { toPdf, strokes, images };
  });
}
async function buildBoardPdf(autosave) {
  const data = boardData(autosave);
  return await pbBuild(window.PDFLib, b64ToBytes(S.pdfB64), exportPages(), data);
}
function saveName() {
  const n = S.pdfName || '수업자료.pdf';
  if (/ \(필기\)\.pdf$/i.test(n)) return n;
  return n.replace(/\.pdf$/i, '') + ' (필기).pdf';
}
function downloadBytes(bytes, name, type) {
  const blob = new Blob([bytes], { type: type || 'application/pdf' });

// 저장: 필기가 찍힌 PDF (다른 뷰어에서도 보이고, 이 앱에서 열면 다시 편집 가능)
async function saveFile() {
  if (!S.doc) { toast('먼저 PDF를 여세요.'); return; }
  if (!window.PDFLib) { toast('저장 기능을 불러오는 중입니다. 잠시 뒤 다시 눌러 주세요.'); return; }
  try {
    // 크롬·엣지: 처음 한 번 위치를 고르면 이후엔 같은 파일에 바로 저장
    if (window.showSaveFilePicker && !S.fileHandle) {
      S.fileHandle = await window.showSaveFilePicker({
        suggestedName: saveName(),
        types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }]
      });
    }
    busy('저장 중…');
    const bytes = await buildBoardPdf(false);
    if (S.fileHandle) {
      const w = await S.fileHandle.createWritable();
      await w.write(bytes);

// 저장해 둔 편집 정보를 화면에 되살림
async function applyBoard(data) {
  S.strokes = (data.strokes || []).map(o => ({ id: o.id, page: o.page, box: o.box || 0, color: o.color, width: o.width, pts: o.pts }));
  for (const bb of (data.boxes || [])) {
    const b = { id: bb.id, page: bb.page, x: bb.x, y: bb.y, w: bb.w, h: bb.h, state: bb.state || '', png: bb.png || '', view: bb.view || null, viewKey: bb.viewKey || '' };
    S.boxes.push(b);
    buildBoxEl(b);
  }
  S.seq = Math.max(1, ...S.strokes.map(o => o.id), ...S.boxes.map(b => b.id)) + 1;
  layout();
  renderAllInk();
  restoreView(data.anchor, data.zoom);
}

/* ---------- 자동 저장 (한 번 파일로 저장한 문서만) ---------- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('pdfBoard', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, k);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const r = db.transaction('kv').objectStore('kv').get(k);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbAutoList() {
  const db = await idb();
  return new Promise((res, rej) => {
    const out = [];
    const r = db.transaction('kv').objectStore('kv').openCursor();
    r.onsuccess = () => {
      const c = r.result;
      if (!c) { res(out.sort((a, b) => b.time - a.time)); return; }
      if (String(c.key).startsWith('auto:')) out.push({ key: c.key, time: c.value.time, name: c.value.name, slot: c.value.slot });
      c.continue();
    };
    r.onerror = () => rej(r.error);
  });
}

let dirty = false, dirtySince = 0, autoTimer = null, autoSlot = 1, autoDir = null, autoBusy = false;
function markDirty() {
  if (!S.doc) return;
  dirty = true;
  if (!dirtySince) dirtySince = Date.now();
  if (!S.saved) return;
  clearTimeout(autoTimer);
  // 멈추고 30초 뒤, 계속 쓰는 중이어도 3분마다
  const wait = Math.max(0, Math.min(30000, dirtySince + 180000 - Date.now()));
  autoTimer = setTimeout(runAutosave, wait);
}
async function runAutosave() {
  if (!dirty || !S.saved || !S.doc || autoBusy) return;
  if (act || gest) { autoTimer = setTimeout(runAutosave, 3000); return; }
  autoBusy = true;
  dirty = false; dirtySince = 0;
  const slot = autoSlot;
  autoSlot = slot === 1 ? 2 : 1;
  try {
    const data = boardData(true);
    await idbSet('auto:' + S.pdfName + ':' + slot, { time: Date.now(), name: S.pdfName, slot, pdfB64: S.pdfB64, data });
  } catch (_) {}
  if (autoDir && window.PDFLib) {
    try {
      const perm = await autoDir.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        const bytes = await buildBoardPdf(true);
        const fname = saveName().replace(/\.pdf$/i, '') + ' 자동' + slot + '.pdf';
        const fh = await autoDir.getFileHandle(fname, { create: true });
        const w = await fh.createWritable();

        await w.close();
      } else {
        showAutoBar('자동 저장 파일을 쓰려면 폴더 사용을 다시 허용해 주세요.', '허용', async () => {

}

let qd = null, qLastTap = 0;

  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  try { quickBtn.setPointerCapture(e.pointerId); } catch (_) {}
  const r = quickBtn.getBoundingClientRect();
  qd = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, l: r.left, t: r.top, moved: false, long: false };
  qd.timer = setTimeout(() => { if (qd) { qd.long = true; openRing(); } }, 500);
});
quickBtn.addEventListener('pointermove', e => {
  if (!qd || e.pointerId !== qd.pid) return;
  const dx = e.clientX - qd.sx, dy = e.clientY - qd.sy;
  if (!qd.moved && Math.hypot(dx, dy) < 14) return;
  if (!qd.moved) { clearTimeout(qd.timer); closeRing(); }
  qd.moved = true;
  const vr = viewer.getBoundingClientRect();
  const spanX = Math.max(1, vr.width - QS - 2 * QM), spanY = Math.max(1, vr.height - QS - 2 * QM);
  qpos = { rx: clamp01((qd.l + dx - vr.left - QM) / spanX), ry: clamp01((qd.t + dy - vr.top - QM) / spanY) };
  placeQuick();
});
['pointerup', 'pointercancel'].forEach(t => quickBtn.addEventListener(t, e => {
  if (!qd || e.pointerId !== qd.pid) return;
  const d = qd;

  clearTimeout(d.timer);
  if (d.moved) { try { localStorage.setItem(QKEY, JSON.stringify(qpos)); } catch (_) {} return; }
  if (d.long || e.type !== 'pointerup') return;
  const now = performance.now();
  if (now - qLastTap < 400) { qLastTap = 0; openRing(); return; }   // 두 번 톡톡 → 색 고르기
  qLastTap = now;
  toggleEraser();
}));

quickBtn.addEventListener('click', e => { if (e.detail === 0) toggleEraser(); });

window.addEventListener('resize', () => { placeQuick(); placeSelBar(); updateVisible(); });
window.addEventListener('orientationchange', () => setTimeout(() => { placeQuick(); updateVisible(); }, 300));

/* ===================== 시작 ===================== */
setMode('auto', true);
setTool('pen');
setPartial(true);
setShapeFix(true);
setColor(COLORS[0]);
setWidth(WIDTHS[1]);
buildRing();
document.body.classList.add('pageborder');
$('borderBtn').classList.add('active');
placeQuick();
updateBtns();
$('ver').textContent = BUILD;
zoomPct.title = BUILD;

function addScript(src, onload) {
  const s = document.createElement('script');
  s.src = src;
  s.onload = onload || null;
  s.onerror = () => toast('스크립트를 불러오지 못했습니다: ' + src);
  document.head.appendChild(s);
}
addScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');
addScript(PDFJS_BASE + 'build/pdf.min.js', () => {
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'build/pdf.worker.min.js';
  }
});
addScript('https://www.geogebra.org/apps/deployggb.js', () => {
  ggbReady = typeof window.GGBApplet !== 'undefined';
  for (const b of S.boxes) if (!(activeBox && activeBox.b === b)) renderBoxBody(b);
  const first = ggbWaiters.shift();
  ggbWaiters.length = 0;
  if (first) activateBox(first);
});
})();
</script>
