<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PDF 판서 · 지오지브라</title>
<style>
:root{
  --bg:#e6eaf1; --bar:#ffffff; --bar-border:#d3d9e3; --text:#1d2b4f; --muted:#667089;
  --btn:#f1f4f9; --btn-hover:#e3e8f1; --active:#2b59c3; --active-text:#ffffff; --sep:#dde2ea;
  --page-edge:#c8cfdb; --msg-bg:rgba(29,43,79,.88); --msg-text:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12151c; --bar:#1b1f29; --bar-border:#2a303d; --text:#e4e8f0; --muted:#98a1b3;
    --btn:#252a36; --btn-hover:#2f3544; --active:#5b86e5; --active-text:#ffffff; --sep:#2f3544;
    --page-edge:#2a303d; --msg-bg:rgba(228,232,240,.92); --msg-text:#12151c;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  position:fixed;inset:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-touch-callout:none;
}
#app{display:flex;flex-direction:column;height:100%}
#toolbar{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;
  padding:6px 10px;padding-top:max(6px, env(safe-area-inset-top));
  background:var(--bar);border-bottom:1px solid var(--bar-border);
  overflow-x:auto;scrollbar-width:none;-webkit-user-select:none;user-select:none;
}
#toolbar::-webkit-scrollbar{display:none}
.group{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.sep{width:1px;height:36px;background:var(--sep);flex:0 0 auto;margin:0 4px}
.spacer{flex:1 1 auto;min-width:4px}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--active);outline-offset:2px}
.tool{
  min-width:54px;height:54px;padding:4px 6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;border:0;border-radius:10px;
  background:var(--btn);cursor:pointer;
}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool span{font-size:11px;line-height:1;white-space:nowrap}
.tool:hover{background:var(--btn-hover)}
.tool.active{background:var(--active);color:var(--active-text)}
.tool:disabled{opacity:.35;cursor:default;background:var(--btn)}
.seg-ctl{display:flex;background:var(--btn);border-radius:10px;padding:3px;gap:2px}
.seg-ctl button{
  border:0;background:transparent;border-radius:8px;cursor:pointer;min-width:54px;height:48px;
  padding:0 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.seg-ctl button b{font-size:14px;font-weight:600}
.seg-ctl button small{font-size:10px;color:var(--muted);white-space:nowrap}
.seg-ctl button.active{background:var(--active);color:var(--active-text)}
.seg-ctl button.active small{color:inherit;opacity:.85}
.swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;background:var(--c);
  border:3px solid var(--bar);box-shadow:0 0 0 1px var(--bar-border)}
.swatch.active{box-shadow:0 0 0 2.5px var(--active)}
.wbtn{width:40px;height:40px;border-radius:10px;border:0;background:var(--btn);cursor:pointer;display:grid;place-items:center}
.wbtn i{display:block;border-radius:50%;background:currentColor}
.wbtn.active{background:var(--active);color:var(--active-text)}
#zoomPct{min-width:56px;text-align:center;font-size:13px;color:var(--muted)}

#viewer{flex:1 1 auto;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#pages{transform-origin:0 0;padding:16px 0 60px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:100%}
.page{position:relative;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);border:1px solid var(--page-edge);flex:0 0 auto}
.page canvas{position:absolute;left:0;top:0;display:block}
.page .pdfc{z-index:1}
.page .boxes{position:absolute;inset:0;z-index:2}
.page .inkc{z-index:3;pointer-events:none}
.pageno{position:absolute;right:6px;bottom:4px;z-index:4;font-size:11px;color:#98a1b3;pointer-events:none}

.ggbbox{position:absolute;background:#fff;border:1px solid rgba(43,89,195,.35);border-radius:6px;
  box-shadow:0 3px 12px rgba(0,0,0,.14);overflow:hidden;display:flex;flex-direction:column}
.ggbbox.live{border-color:var(--active)}
.bxhead,.bxresize{opacity:.14;transition:opacity .15s}
.ggbbox.ui-show .bxhead,.ggbbox.ui-show .bxresize,
body.mode-ggb .bxhead,body.mode-ggb .bxresize{opacity:1}
.bxhead{height:34px;flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 4px;
  background:var(--active);color:#fff;font-size:12px;touch-action:none;cursor:move;-webkit-user-select:none;user-select:none}
.bxhead .t{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.bxhead button{height:26px;padding:0 8px;border:0;border-radius:6px;background:rgba(255,255,255,.22);color:#fff;font-size:12px;cursor:pointer}
.bxbody{flex:1 1 auto;position:relative;background:#fff}
.bxbody img{width:100%;height:100%;display:block;object-fit:fill}
.bxbody .host{width:100%;height:100%}
.bxresize{position:absolute;right:0;bottom:0;width:28px;height:28px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg, transparent 50%, var(--active) 50%);opacity:.75}

#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);
  font-size:15px;line-height:1.7;padding:24px;pointer-events:none}
#quickBtn{
  position:absolute;z-index:60;left:0;top:0;width:58px;height:58px;padding:0;border-radius:50%;
  border:1px solid var(--bar-border);background:var(--bar);color:var(--text);
  box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer;touch-action:none;
}
#quickBtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#quickBtn .q-eraser{display:none}
#quickBtn.eraser{background:var(--active);color:var(--active-text);border-color:transparent}
#quickBtn.eraser .q-pen{display:none}
#quickBtn.eraser .q-eraser{display:block}
#selBar{position:absolute;z-index:58;display:none;gap:4px;padding:4px;background:var(--bar);
  border:1px solid var(--bar-border);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.16)}
#selBar.show{display:flex}
#selBar button{height:40px;padding:0 14px;border:0;border-radius:8px;cursor:pointer;background:var(--btn);color:var(--text);font-size:14px;font-weight:600}
#selBar button.danger{background:#e03131;color:#fff}
#toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-8px);z-index:70;
  background:var(--msg-bg);color:var(--msg-text);font-size:14px;padding:9px 14px;border-radius:8px;
  pointer-events:none;opacity:0;transition:opacity .18s,transform .18s;max-width:calc(100% - 24px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#busy{position:absolute;inset:0;z-index:80;display:none;place-items:center;background:rgba(0,0,0,.35);color:#fff;font-size:15px}
#busy.show{display:grid}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="group">
      <button class="tool" id="openPdfBtn" aria-label="PDF 열기">
        <svg viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 0 1 2-2h6l2 2h4a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 15.5v-6M9.5 12L12 9.5l2.5 2.5"/></svg><span>PDF 열기</span>
      </button>
      <button class="tool" id="saveBtn" aria-label="저장">
        <svg viewBox="0 0 24 24"><path d="M5 4.5h11L19.5 8v11.5h-15z"/><path d="M8.5 4.5v5h7"/><rect x="8" y="13" width="8" height="6.5"/></svg><span>저장</span>
      </button>
      <button class="tool" id="loadBtn" aria-label="불러오기">
        <svg viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v11.5z"/><path d="M12 9.5v6M9.5 13L12 15.5 14.5 13"/></svg><span>불러오기</span>
      </button>
    </div>
    <div class="sep"></div>
    <div class="seg-ctl" role="group" aria-label="입력 모드">
      <button data-mode="auto"><b>자동</b><small>펜 필기·손 조작</small></button>
      <button data-mode="draw"><b>필기</b><small>모든 입력 필기</small></button>
      <button data-mode="ggb"><b>조작</b><small>모든 입력 조작</small></button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="tool" data-tool="pen" aria-label="펜">
        <svg viewBox="0 0 24 24"><path d="M4 20l1-4.2L16.3 4.5a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.2 19z"/><path d="M14.5 6.3l3.2 3.2"/></svg><span>펜</span>
      </button>
      <button class="tool" data-tool="eraser" aria-label="지우개">
        <svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.6 15.6l9.8-9.8a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 18.8H7.8z"/><path d="M9.2 11l4.8 4.8"/></svg><span>지우개</span>
      </button>
      <button class="tool" id="partialBtn" aria-pressed="false" aria-label="부분 지우기">
        <svg viewBox="0 0 24 24"><path d="M3 18c2.5-4 4.5-5.5 6-5"/><path d="M15 11c1.5-2 3.5-4.5 6-6"/><circle cx="12" cy="12" r="3.4" stroke-dasharray="2 2"/></svg><span>부분 지우기</span>
      </button>
      <button class="tool" data-tool="select" aria-label="영역 선택">
        <svg viewBox="0 0 24 24"><path d="M12 4.5c4.4 0 8 2.1 8 4.8s-3.6 4.8-8 4.8-8-2.1-8-4.8 3.6-4.8 8-4.8z" stroke-dasharray="2.6 2.4"/><path d="M7.5 13.3c-1 1.6-.6 3.2 1 3.9 1.3.6 1.4 2 .2 3.3"/></svg><span>영역 선택</span>
      </button>
      <button class="tool" id="shapeBtn" aria-pressed="true" aria-label="도형 보정">
        <svg viewBox="0 0 24 24"><path d="M3 20.5L11.5 12"/><circle cx="16.5" cy="7.5" r="4.5"/></svg><span>도형 보정</span>
      </button>
    </div>
    <div class="sep"></div>
    <div class="group" id="colors"></div>
    <div class="sep"></div>
    <div class="group" id="widths"></div>
    <div class="sep"></div>
    <div class="group">
      <button class="tool" id="addGgbBtn" aria-label="지오지브라 추가">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M12 9v6M9 12h6"/></svg><span>지오지브라 추가</span>
      </button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="tool" id="zoomOut" aria-label="축소">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6M20 20l-4.4-4.4"/></svg><span>축소</span>
      </button>
      <div id="zoomPct">100%</div>
      <button class="tool" id="zoomIn" aria-label="확대">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M8 11h6M11 8v6M20 20l-4.4-4.4"/></svg><span>확대</span>
      </button>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button class="tool" id="undoBtn" aria-label="필기 실행 취소">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>필기 취소</span>
      </button>
      <button class="tool" id="redoBtn" aria-label="필기 다시 실행">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>다시 실행</span>
      </button>
    </div>
  </header>

  <main id="viewer">
    <div id="pages"></div>
    <div id="empty">PDF를 열어 시작하세요.<br>필기와 지오지브라 창은 저장 파일 하나에 PDF와 함께 담깁니다.</div>
  </main>
</div>

<button id="quickBtn" aria-label="펜/지우개 전환">
  <svg class="q-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.2L16.3 4.5a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.2 19z"/><path d="M14.5 6.3l3.2 3.2"/></svg>
  <svg class="q-eraser" viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.6 15.6l9.8-9.8a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 18.8H7.8z"/><path d="M9.2 11l4.8 4.8"/></svg>
</button>
<div id="selBar" role="toolbar" aria-label="선택한 필기">
  <button class="danger" id="selDel">삭제</button>
  <button id="selDone">선택 해제</button>
</div>
<div id="toast" role="status"></div>
<div id="busy">처리 중…</div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileInput" hidden>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const viewer = $('viewer'), pagesEl = $('pages'), emptyEl = $('empty');
const toastEl = $('toast'), busyEl = $('busy'), quickBtn = $('quickBtn'), selBar = $('selBar');
const zoomPct = $('zoomPct'), partialBtn = $('partialBtn'), shapeBtn = $('shapeBtn');
const undoBtn = $('undoBtn'), redoBtn = $('redoBtn');
const pdfInput = $('pdfInput'), fileInput = $('fileInput');

const COLORS = ['#141414', '#e03131', '#1c6fd6', '#2f9e44', '#f08c00'];
const WIDTHS = [2, 3, 5];
const GLOW = 'rgba(43,89,195,0.28)';
const SEL = '#2b59c3';
const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
const MODE_MSG = {
  auto: '자동: 펜은 필기, 손가락은 스크롤·확대·지오지브라 조작',
  draw: '필기: 모든 입력이 필기가 됩니다 (이 모드에서는 손가락 스크롤이 안 됩니다)',
  ggb: '조작: 필기 없이 스크롤과 지오지브라 조작만 합니다'
};

const S = {
  mode: 'auto', tool: 'pen', partial: false, shapeFix: true,
  color: COLORS[0], width: WIDTHS[1], zoom: 1,
  strokes: [], boxes: [], sel: new Set(), undo: [], redo: [], seq: 1,
  pdfName: '', pdfB64: '', doc: null, pages: []
};
let act = null, activeBox = null, penSeen = false, guardUntil = 0, pinch = null;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const blockedTouches = new Set();
const tt = { pts: new Map(), start: 0, max: 0, bad: false };

/* ===================== 공통 ===================== */
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), msg.length > 40 ? 6000 : 2600);
}
function busy(msg) {
  if (msg) { busyEl.textContent = msg; busyEl.classList.add('show'); }
  else busyEl.classList.remove('show');
}
const inUI = t => t instanceof Node && !!(t.closest && t.closest('#toolbar, #quickBtn, #selBar, .bxhead, .bxresize'));
function swallow(e) {
  if (e.cancelable) e.preventDefault();
  e.stopImmediatePropagation();
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  let t = L < 1e-12 ? 0 : ((px - ax) * dx + (py - ay) * dy) / L;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
function bboxOf(s) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of s) {
    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  return { x0, y0, x1, y1 };
}
const nearBB = (bb, x, y, r) => x >= bb.x0 - r && x <= bb.x1 + r && y >= bb.y0 - r && y <= bb.y1 + r;
function abToB64(buf) {
  const bytes = new Uint8Array(buf);
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s);
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* ===================== 필기 그리기 ===================== */
const pf = pr => 0.4 + 1.2 * pr;
function mid(p, i) { return [(p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2]; }
function piece(ctx, p, j, bw, ex) {
  ctx.beginPath();
  if (j === 1) {
    const m = mid(p, 0);
    ctx.lineWidth = bw * pf((p[0][2] + p[1][2]) / 2) + ex;
    ctx.moveTo(p[0][0], p[0][1]);
    ctx.lineTo(m[0], m[1]);
  } else {
    const a = mid(p, j - 2), b = mid(p, j - 1), c = p[j - 1];
    ctx.lineWidth = bw * pf(c[2]) + ex;
    ctx.moveTo(a[0], a[1]);
    ctx.quadraticCurveTo(c[0], c[1], b[0], b[1]);
  }
  ctx.stroke();
}
function tail(ctx, p, bw, ex) {
  const n = p.length;
  if (n < 2) return;
  const m = mid(p, n - 2), e = p[n - 1];
  ctx.beginPath();
  ctx.lineWidth = bw * pf(e[2]) + ex;
  ctx.moveTo(m[0], m[1]);
  ctx.lineTo(e[0], e[1]);
  ctx.stroke();
}
function setStyle(ctx, color) {
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
function drawPts(ctx, p, color, bw, ex) {
  const n = p.length;
  if (!n) return;
  ctx.save();
  setStyle(ctx, color);
  if (n === 1) {
    ctx.beginPath();
    ctx.arc(p[0][0], p[0][1], (bw * pf(p[0][2]) + ex) / 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    for (let j = 1; j < n; j++) piece(ctx, p, j, bw, ex);
    tail(ctx, p, bw, ex);
  }
  ctx.restore();
}
function strokeBB(o) {
  if (!o._bb || o._n !== o.pts.length) { o._bb = bboxOf(o.pts); o._n = o.pts.length; }
  return o._bb;
}
const invalidate = o => { o._bb = null; o._n = -1; };

function renderInk(p) {
  const i = p.num - 1, ctx = p.ictx;
  if (!p.inkc.width) return;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, p.inkc.width, p.inkc.height);
  ctx.restore();
  const selOn = S.tool === 'select' && S.sel.size > 0;
  for (const o of S.strokes) {
    if (o.page !== i) continue;
    if (selOn && S.sel.has(o.id)) drawPts(ctx, o.pts, GLOW, o.width, 10 / S.zoom);
    drawPts(ctx, o.pts, o.color, o.width, 0);
  }
  if (act && act.pi === i) {
    if (act.kind === 'lasso' && act.path.length > 1) {
      ctx.save();
      ctx.strokeStyle = SEL; ctx.fillStyle = 'rgba(43,89,195,0.06)';
      ctx.lineWidth = 1.5 / S.zoom; ctx.setLineDash([5 / S.zoom, 4 / S.zoom]);
      ctx.beginPath();
      ctx.moveTo(act.path[0][0], act.path[0][1]);
      for (let k = 1; k < act.path.length; k++) ctx.lineTo(act.path[k][0], act.path[k][1]);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    if (act.kind === 'eraser' && act.ring) {
      ctx.save();
      ctx.strokeStyle = 'rgba(29,43,79,.55)'; ctx.lineWidth = 1.5 / S.zoom;
      ctx.beginPath(); ctx.arc(act.ring[0], act.ring[1], act.r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
  if (selOn) placeSelBar();
}
function renderAllInk() { for (const p of S.pages) renderInk(p); updateBtns(); placeSelBar(); }

function selBBoxPage() {

async function loadPdfFromB64(b64, reset) {
  const doc = await window.pdfjsLib.getDocument({
    data: b64ToBytes(b64),
    cMapUrl: PDFJS_BASE + 'cmaps/',          // 한글 등 비라틴 문자
    cMapPacked: true,
    standardFontDataUrl: PDFJS_BASE + 'standard_fonts/'   // 글꼴이 내장되지 않은 PDF
  }).promise;

    S.strokes = []; S.sel.clear(); S.undo = []; S.redo = [];
    activeBox = null;
    S.boxes.forEach(b => b.el && b.el.remove());
    S.boxes = [];
    S.seq = 1;
  }
  pagesEl.innerHTML = '';
  S.pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale: 1 });
    const el = document.createElement('div');
    el.className = 'page';
    const pdfc = document.createElement('canvas'); pdfc.className = 'pdfc';
    const pdfc2 = document.createElement('canvas'); pdfc2.className = 'pdfc'; pdfc2.style.visibility = 'hidden';
    const boxes = document.createElement('div'); boxes.className = 'boxes';
    const inkc = document.createElement('canvas'); inkc.className = 'inkc';
    const no = document.createElement('div'); no.className = 'pageno'; no.textContent = i + ' / ' + doc.numPages;
    el.append(pdfc, pdfc2, boxes, inkc, no);
    pagesEl.appendChild(el);

      front: pdfc, back: pdfc2, frontReg: null, inkReg: null, inkZoom: 0,
      inkc, ictx: inkc.getContext('2d'), boxesEl: boxes,
      rendered: false, task: null, gen: 0, pending: false
    });
  }

  for (const b of S.boxes) if (S.pages[b.page]) { S.pages[b.page].boxesEl.appendChild(b.el); }
  layout();
}
async function openPdfFile(file) {
  busy('PDF 여는 중…');
  try {
    const buf = await file.arrayBuffer();
    S.pdfB64 = abToB64(buf);
    S.pdfName = file.name;
    await loadPdfFromB64(S.pdfB64, true);
    toast(file.name + ' 열기 완료');
  } catch (err) {
    toast('PDF를 열지 못했습니다: ' + err.message);
  }
  busy(false);
}

  if (e && e.message) toast('오류: ' + String(e.message).slice(0, 120));
});

/* ===================== 저장 · 불러오기 ===================== */
function saveFile() {
  if (!S.doc) { toast('먼저 PDF를 여세요.'); return; }
  busy('저장 파일 만드는 중…');
  freezeActive();
  setTimeout(() => {
    try {
      const data = {
        v: 1, app: 'pdf-board', pdfName: S.pdfName, pdf: S.pdfB64, zoom: S.zoom,
        strokes: S.strokes.map(o => ({ id: o.id, page: o.page, color: o.color, width: o.width, pts: o.pts })),
        boxes: S.boxes.map(b => ({ id: b.id, page: b.page, x: b.x, y: b.y, w: b.w, h: b.h, state: b.state, png: b.png }))
      };
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      const name = (S.pdfName.replace(/\.pdf$/i, '') || '수업자료') + '.board.json';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      toast('저장했습니다: ' + name);
    } catch (err) {
      toast('저장 실패: ' + err.message);
    }
    busy(false);
  }, 60);
}
async function loadFile(file) {
  busy('불러오는 중…');
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || data.app !== 'pdf-board' || !data.pdf) throw new Error('이 앱에서 저장한 파일이 아닙니다');
    S.pdfName = data.pdfName || '';
    S.pdfB64 = data.pdf;
    S.zoom = data.zoom || 1;
    await loadPdfFromB64(S.pdfB64, true);
    S.strokes = (data.strokes || []).map(o => ({ id: o.id, page: o.page, color: o.color, width: o.width, pts: o.pts }));
    for (const bb of (data.boxes || [])) {
      const b = { id: bb.id, page: bb.page, x: bb.x, y: bb.y, w: bb.w, h: bb.h, state: bb.state || '', png: bb.png || '' };
      S.boxes.push(b);
      buildBoxEl(b);
    }
    S.seq = Math.max(1, ...S.strokes.map(o => o.id), ...S.boxes.map(b => b.id)) + 1;
    layout();
    renderAllInk();
    toast('불러왔습니다: ' + (S.pdfName || file.name));
  } catch (err) {
    toast('불러오기 실패: ' + err.message);
  }
  busy(false);
}

/* ===================== UI ===================== */
function setMode(m, silent) {
  if (act) return;
  S.mode = m;
  document.body.classList.toggle('mode-ggb', m === 'ggb');
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  if (!silent) toast(MODE_MSG[m]);
}
function setTool(t) {
  if (act) return;
  S.tool = t;
  if (t !== 'select') S.sel.clear();
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  quickBtn.classList.toggle('eraser', t === 'eraser');
  renderAllInk();
  placeSelBar();
}
function toggleEraser() {
  if (act) return;
  setTool(S.tool === 'eraser' ? 'pen' : 'eraser');
  toast(S.tool === 'eraser' ? '지우개로 전환' : '펜으로 전환');
}
function setPartial(v) {
  S.partial = v;
  partialBtn.classList.toggle('active', v);
  partialBtn.setAttribute('aria-pressed', String(v));
}
function setShapeFix(v) {
  S.shapeFix = v;
  shapeBtn.classList.toggle('active', v);
  shapeBtn.setAttribute('aria-pressed', String(v));
}
function applyToSel(fn) {
  if (S.tool !== 'select' || !S.sel.size || act) return false;
  pushUndo(snapshot());
  for (const o of S.strokes) if (S.sel.has(o.id)) fn(o);
  renderAllInk();
  return true;
}
function setColor(c) {
  S.color = c;
  document.querySelectorAll('.swatch').forEach(b => b.classList.toggle('active', b.dataset.color === c));
  if (applyToSel(o => { o.color = c; })) return;
  if (S.tool !== 'pen') setTool('pen');
}
function setWidth(w) {
  S.width = w;
  document.querySelectorAll('.wbtn').forEach(b => b.classList.toggle('active', Number(b.dataset.width) === w));
  if (applyToSel(o => { o.width = w; })) return;
  if (S.tool !== 'pen') setTool('pen');
}

document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => {
  setTool(b.dataset.tool);
  if (b.dataset.tool === 'select') toast('필기를 둘러싸서 선택한 뒤, 상자 안을 끌어 옮기거나 삭제를 누르세요.');
}));
partialBtn.addEventListener('click', () => {
  setPartial(!S.partial);
  setTool('eraser');
  toast(S.partial ? '부분 지우기: 지우개가 닿은 부분만 지웁니다.' : '획 지우기: 닿은 획을 통째로 지웁니다.');
});
let shapeHold = null;
shapeBtn.addEventListener('pointerdown', () => {
  clearTimeout(shapeHold);
  shapeHold = setTimeout(() => {
    shapeHold = null;
    diagOn = !diagOn;
    toast(diagOn ? '진단 표시 켬' : '진단 표시 끔');
  }, 800);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => shapeBtn.addEventListener(t, () => clearTimeout(shapeHold)));
shapeBtn.addEventListener('click', () => {
  if (shapeHold === null) { shapeHold = undefined; return; }
  setShapeFix(!S.shapeFix);
  toast(S.shapeFix ? '도형 보정: 선이나 원을 그린 뒤 펜을 멈추고 기다리면 반듯하게 바뀝니다.' : '도형 보정을 껐습니다.');
});

const colorsEl = $('colors');
COLORS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'swatch';
  b.dataset.color = c;
  b.style.setProperty('--c', c);
  b.setAttribute('aria-label', '색 ' + c);
  b.addEventListener('click', () => setColor(c));
  colorsEl.appendChild(b);
});
const widthsEl = $('widths');
['가늘게', '보통', '굵게'].forEach((label, i) => {
  const w = WIDTHS[i];
  const b = document.createElement('button');
  b.className = 'wbtn';
  b.dataset.width = w;
  b.setAttribute('aria-label', '굵기 ' + label);
  const d = 4 + w * 2;
  b.innerHTML = '<i style="width:' + d + 'px;height:' + d + 'px"></i>';
  b.addEventListener('click', () => setWidth(w));
  widthsEl.appendChild(b);
});

$('openPdfBtn').addEventListener('click', () => pdfInput.click());
pdfInput.addEventListener('change', () => {
  const f = pdfInput.files && pdfInput.files[0];
  pdfInput.value = '';
  if (f) openPdfFile(f);
});
$('loadBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const f = fileInput.files && fileInput.files[0];
  fileInput.value = '';
  if (f) loadFile(f);
});
$('saveBtn').addEventListener('click', saveFile);
$('addGgbBtn').addEventListener('click', addBox);
$('zoomIn').addEventListener('click', () => setZoom(S.zoom * 1.25));
$('zoomOut').addEventListener('click', () => setZoom(S.zoom / 1.25));
undoBtn.addEventListener('click', undo);
redoBtn.addEventListener('click', redo);
$('selDel').addEventListener('click', deleteSel);
$('selDone').addEventListener('click', clearSel);

/* 떠 있는 펜/지우개 버튼 */
const QKEY = 'pdfBoard.quickPos', QS = 58, QM = 12;
const clamp01 = v => Math.min(1, Math.max(0, v));
let qpos = { rx: 1, ry: 1 };
try {
  const v = JSON.parse(localStorage.getItem(QKEY));
  if (v && isFinite(v.rx) && isFinite(v.ry)) qpos = { rx: clamp01(v.rx), ry: clamp01(v.ry) };
} catch (_) {}
function placeQuick() {
  const vr = viewer.getBoundingClientRect();
  const spanX = Math.max(0, vr.width - QS - 2 * QM), spanY = Math.max(0, vr.height - QS - 2 * QM);
  quickBtn.style.left = (vr.left + QM + qpos.rx * spanX) + 'px';
  quickBtn.style.top = (vr.top + QM + qpos.ry * spanY) + 'px';
}
let qd = null;
quickBtn.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  try { quickBtn.setPointerCapture(e.pointerId); } catch (_) {}
  const r = quickBtn.getBoundingClientRect();
  qd = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, l: r.left, t: r.top, moved: false };
});
quickBtn.addEventListener('pointermove', e => {
  if (!qd || e.pointerId !== qd.pid) return;
  const dx = e.clientX - qd.sx, dy = e.clientY - qd.sy;
  if (!qd.moved && Math.hypot(dx, dy) < 6) return;
  qd.moved = true;
  const vr = viewer.getBoundingClientRect();
  const spanX = Math.max(1, vr.width - QS - 2 * QM), spanY = Math.max(1, vr.height - QS - 2 * QM);
  qpos = { rx: clamp01((qd.l + dx - vr.left - QM) / spanX), ry: clamp01((qd.t + dy - vr.top - QM) / spanY) };
  placeQuick();
});
['pointerup', 'pointercancel'].forEach(t => quickBtn.addEventListener(t, e => {
  if (!qd || e.pointerId !== qd.pid) return;
  const d = qd;
  qd = null;
  if (d.moved) { try { localStorage.setItem(QKEY, JSON.stringify(qpos)); } catch (_) {} }
  else if (e.type === 'pointerup') toggleEraser();
}));
quickBtn.addEventListener('touchstart', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
quickBtn.addEventListener('click', e => { if (e.detail === 0) toggleEraser(); });

window.addEventListener('resize', () => { placeQuick(); placeSelBar(); updateVisible(); });

/* ===================== 시작 ===================== */
setMode('auto', true);
setTool('pen');
setPartial(false);
setShapeFix(true);
setColor(COLORS[0]);
setWidth(WIDTHS[1]);
placeQuick();
updateBtns();

function addScript(src, onload) {
  const s = document.createElement('script');
  s.src = src;
  s.onload = onload || null;
  s.onerror = () => toast('스크립트를 불러오지 못했습니다: ' + src);
  document.head.appendChild(s);
}
addScript(PDFJS_BASE + 'build/pdf.min.js', () => {
  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'build/pdf.worker.min.js';
  }
});
addScript('https://www.geogebra.org/apps/deployggb.js', () => {
  ggbReady = typeof window.GGBApplet !== 'undefined';
  for (const b of S.boxes) if (!(activeBox && activeBox.b === b)) renderBoxBody(b);
  const first = ggbWaiters.shift();
  ggbWaiters.length = 0;
  if (first) activateBox(first);
});
})();
</script>
